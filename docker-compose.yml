services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Root2205!
      POSTGRES_DB: shalom_dhis2
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
      target: development  # Changed from deps to development
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin 
      DB_PASS: Root2205!
      DB_NAME: shalom_dhis2
      JWT_SECRET: AkoryAlye12345!
      JWT_EXPIRATION: 3600s

  frontend_web:
    build: 
      context: ./frontend-web
      target: development
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  db_data:
