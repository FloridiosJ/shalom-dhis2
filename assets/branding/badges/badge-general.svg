<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge background -->
  <rect width="600" height="200" rx="20" fill="#2E7D32"/>
  
  <!-- Logo mark (smaller) -->
  <g transform="translate(80, 100)">
    <!-- Vertical bar -->
    <rect x="-15" y="-50" width="30" height="100" rx="4" fill="white"/>
    <!-- Horizontal bar -->
    <rect x="-50" y="-15" width="100" height="30" rx="4" fill="white"/>
    <!-- Heart -->
    <path d="M 0,-8 C -4,-13 -10,-13 -13,-8 C -15,-3 -15,3 -10,8 L 0,15 L 10,8 C 15,3 15,-3 13,-8 C 10,-13 4,-13 0,-8 Z" 
          fill="#C8E6C9" opacity="0.9"/>
  </g>
  
  <!-- Department text -->
  <text x="180" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="white">MÉDECINE GÉNÉRALE</text>
  <text x="180" y="130" font-family="Arial, sans-serif" font-size="20" 
        fill="white" opacity="0.9">Département de Médecine Générale</text>
</svg>
