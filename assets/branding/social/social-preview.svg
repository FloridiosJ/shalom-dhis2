<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Logo on the left -->
  <g transform="translate(200, 315)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="140" fill="#2E7D32" opacity="0.1"/>
    
    <!-- Main Medical Cross -->
    <g>
      <!-- Vertical bar -->
      <rect x="-20" y="-65" width="40" height="130" rx="5" fill="#2E7D32"/>
      <!-- Horizontal bar -->
      <rect x="-65" y="-20" width="130" height="40" rx="5" fill="#2E7D32"/>
      
      <!-- Heart symbol -->
      <path d="M 0,-10 C -5,-17 -13,-17 -16,-10 C -20,-3 -20,3 -13,10 L 0,20 L 13,10 C 20,3 20,-3 16,-10 C 13,-17 5,-17 0,-10 Z" 
            fill="#E53935" opacity="0.9"/>
    </g>
    
    <!-- Decorative circles -->
    <circle cx="-75" cy="-75" r="5" fill="#4CAF50" opacity="0.6"/>
    <circle cx="75" cy="-75" r="5" fill="#4CAF50" opacity="0.6"/>
    <circle cx="-75" cy="75" r="5" fill="#4CAF50" opacity="0.6"/>
    <circle cx="75" cy="75" r="5" fill="#4CAF50" opacity="0.6"/>
  </g>
  
  <!-- Text content on the right -->
  <text x="450" y="260" font-family="Arial, sans-serif" font-size="80" font-weight="bold" 
        fill="#2E7D32">SHALOM</text>
  <text x="450" y="330" font-family="Arial, sans-serif" font-size="36" 
        fill="#1B5E20">Système de Gestion de Santé</text>
  <text x="450" y="390" font-family="Arial, sans-serif" font-size="28" 
        fill="#666666">Gestion des dispensaires · Inspiré de DHIS2</text>
  
  <!-- Bottom tagline -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="24" 
        text-anchor="middle" fill="#999999">Collecte et analyse de données médicales</text>
</svg>
