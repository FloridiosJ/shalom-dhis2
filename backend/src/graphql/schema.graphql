# Custom scalars
scalar DateTime

# Enums
enum UserRole {
  admin
  manager
  agent
}

enum AgentSpecialite {
  sage_femme
  infirmier
  infirmiere
}

enum ConsultationStatus {
  en_cours
  termine
  suivi_requis
  active
  completed
  cancelled
}

enum Gender {
  M
  F
  L
}

enum Religion {
  Kristianina
  Musulman
  traditionnelle
}

enum Synoda {
  SPA
  SPSofia
  SPBM
  SPMel
}

enum OutilsEvent {
  presentiel
  visio
}

enum EventStatus {
  planifie
  en_cours
  termine
  annule
}

enum SortDirection {
  ASC
  DESC
}

# Enums pour Vaccination
enum TypeVaccin {
  BCG_POLIO_O
  DTCOQ_HEP_B_POLIO_I
  DTCOQ_HEP_B_POLIO_II
  DTCOQ_HEP_B_POLIO_III
  VAR
  VAA
  DTCOQ_HEP_B_POLIO_RAPPEL
  VPO_RAPPEL
  AUTRES
}

# Enums pour ActiviteSpirituelle
enum TypeActiviteSpirituelle {
  culte
  priere
}

# User type
type User {
  id: ID!
  nom: String!
  prenom: String!
  email: String
  login: String!
  role: UserRole!
  specialite: AgentSpecialite
  dispensaireId: ID
  dispensaire: Dispensaire
  isActive: Boolean!
  lastLoginAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  fullName: String!
}

# Dispensaire type
type Dispensaire {
  id: ID!
  name: String!
  fileovana: String!
  synoda: Synoda!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  users: [User!]!
  dataEntries: [DataEntry!]!
  userCount: Int!
  activeUserCount: Int!
}

# Patient type
