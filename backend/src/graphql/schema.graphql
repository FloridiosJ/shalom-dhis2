# Ajoutez ces types si pas déjà présents
type TopDiagnostic {
  diagnostic: String!
  count: Int!
  percentage: Float!
}

type TopMedication {
  medicament: String!
  count: Int!
  avgDuree: String
  totalDuree: String
}

type ConsultationEvolution {
  period: String!
