# Custom scalars
scalar DateTime

# Enums
enum UserRole {
  admin
  manager
  agent
}

enum AgentSpecialite {
  sage_femme
  infirmier
  infirmiere
}

enum ConsultationStatus {
  en_cours
  termine
  suivi_requis
  active
  completed
  cancelled
}

enum Gender {
  M
  F
  L
}

enum Religion {
  Kristianina
  Musulman
  traditionnelle
}

enum Synoda {
  SPA
  SPSofia
  SPBM
  SPMel
}

enum OutilsEvent {
  presentiel
  visio
}

enum EventStatus {
  planifie
  en_cours
  termine
  annule
}

enum SortDirection {
  ASC
  DESC
}

# Enums pour Vaccination
enum TypeVaccin {
  BCG_POLIO_O
  DTCOQ_HEP_B_POLIO_I
  DTCOQ_HEP_B_POLIO_II
  DTCOQ_HEP_B_POLIO_III
  VAR
  VAA
  DTCOQ_HEP_B_POLIO_RAPPEL
  VPO_RAPPEL
  AUTRES
}

# Enums pour ActiviteSpirituelle
enum TypeActiviteSpirituelle {
  culte
  priere
}

# Location type for geolocation data
type Location {
  lat: Float!
  lon: Float!
  accuracy: Float
  timestamp: String
}

# User type
type User {
  id: ID!
  nom: String!
  prenom: String!
  email: String
  login: String!
  role: UserRole!
  specialite: AgentSpecialite
  dispensaireId: ID
  dispensaire: Dispensaire
  isActive: Boolean!
  lastLoginAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  fullName: String!
}

# Dispensaire type
type Dispensaire {
  id: ID!
  name: String!
  fileovana: String!
  synoda: Synoda!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  users: [User!]!
  dataEntries: [DataEntry!]!
  userCount: Int!
  activeUserCount: Int!
}

# Patient type
type Patient {
  id: ID!
  nom: String!
  prenom: String
  age: Int # Calculated from dateNaissance
  dateNaissance: String # Date de naissance (YYYY-MM-DD)
  sexe: String!
  religion: Religion!
  village: String!
  numeroPatient: String!
  dispensaireId: ID!
  userId: ID!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: User!
  dispensaire: Dispensaire!
  consultations: [DataEntry!]!
  vaccinations: [Vaccination!]! # ✅ AJOUTER
  displayName: String!
  categorieAge: String!
  isMineur: Boolean!
  location: Location # Optional geolocation capture
}

# TypeConsultation type
type TypeConsultation {
  code: String!
  libelle: String!
  description: String
  isActive: Boolean!
  dataEntriesCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Association DataEntry <-> CategorieMaladie avec métadonnées
type CategorieWithMeta {
  id: ID!
  nom: String! # ✅ Utilise "nom" comme CategorieMaladie
  code: String
  niveau: Int!
  ordre: Int
  description: String
  isPrincipal: Boolean!
  notes: String
  parent: CategorieMaladie
  cheminComplet: String!
  associationCreatedAt: DateTime
}

# DataEntry type (Consultation)
type DataEntry {
  id: ID!
  patientId: ID!
  patient: Patient!
  typeConsultation: String!
  typeConsultationDetails: TypeConsultation
  diagnostic: String!
  prescription: String
  prescriptionItems: [PrescriptionItem!]!
  notes: String
  dateConsultation: DateTime!
  dateOnly: String
  timeConsultation: String
  dispensaireId: ID!
  dispensaire: Dispensaire!
  userId: ID!
  createdBy: User!
  status: ConsultationStatus!
  categories: [CategorieMaladie!]!
  categoriesWithMeta: [CategorieWithMeta!]!
  principalCategorie: CategorieMaladie
  vaccinations: [Vaccination!]! # ✅ AJOUTER
  isActive: Boolean!
  summary: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  location: Location # Optional geolocation capture
}

# Event type
type Event {
  id: ID!
  date: DateTime!
  type_event: String!
  participant: String!
  outils: OutilsEvent!
  description: String
  lieu: String
  userId: ID!
  dispensaireId: ID
  status: EventStatus!
