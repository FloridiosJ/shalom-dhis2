type Query {
  # Auth
  me: User

  # Users
  user(id: ID!): User
  users(filter: UserFilterInput, pagination: PaginationInput): UserConnection!

  # Dispensaires
  dispensaire(id: ID!): Dispensaire
  dispensaires(filter: DispensaireFilterInput, pagination: PaginationInput): DispensaireConnection!

  # Patients
  patient(id: ID!): Patient
  patientByNumero(numero: String!): Patient
  patients(filter: PatientFilterInput, sort: SortInput, pagination: PaginationInput): PatientConnection!
  searchPatients(query: String!, dispensaireId: ID, limit: Int): [Patient!]!

  # DataEntries (Consultations)
  dataEntry(id: ID!): DataEntry
  dataEntries(filter: DataEntryFilterInput, sort: SortInput, pagination: PaginationInput): DataEntryConnection!
  patientConsultations(patientId: ID!, limit: Int): [DataEntry!]!
  recentConsultations(dispensaireId: ID, limit: Int): [DataEntry!]!
  
  # TypeConsultation
  typeConsultation(code: String!): TypeConsultation
  typeConsultations(isActive: Boolean): [TypeConsultation!]!

  # Statistics
  consultationStatsByType: [ConsultationStatsByType!]!
  consultationStats(dispensaireId: ID, userId: ID): ConsultationOverallStats!

  # Events
  event(id: ID!): Event
  events(filter: EventFilterInput, sort: SortInput, pagination: PaginationInput): EventConnection!

  # CategorieMaladie
  categorieMaladie(id: ID!): CategorieMaladie
  categorieMaladieByCode(code: String!): CategorieMaladie
  categoriesMaladies(filter: CategorieMaladieFilterInput): [CategorieMaladie!]!
  categoriesPrincipales(activeOnly: Boolean): [CategorieMaladie!]!
  arbreCategories(activeOnly: Boolean): [ArbreCategorie!]!
  sousCategories(parentId: ID!, activeOnly: Boolean): [CategorieMaladie!]!
  categoriesStats(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): [CategorieStats!]!
  checkDeleteCategorie(id: ID!): DeleteCheckResponse!

  # Vaccination queries
  vaccination(id: ID!): Vaccination
  vaccinations(filter: VaccinationFilterInput, sort: SortInput, pagination: PaginationInput): VaccinationConnection!
  patientVaccinations(patientId: ID!, limit: Int): [Vaccination!]!
  recentVaccinations(limit: Int): [Vaccination!]!
  vaccinationStats(agentId: ID, dateFrom: DateTime, dateTo: DateTime): [VaccinationStats!]!
  couvertureVaccinale(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): CouvertureVaccinale!

  # ActiviteSpirituelle queries
  activiteSpirituelle(id: ID!): ActiviteSpirituelle
  activitesSpiritulles(filter: ActiviteSprituelleFilterInput, sort: SortInput, pagination: PaginationInput): ActiviteSprituelleConnection!
  dispensaireActivites(dispensaireId: ID!, limit: Int): [ActiviteSpirituelle!]!
  recentesActivitesSpiritulles(limit: Int): [ActiviteSpirituelle!]!
  activitesSpirituellesStats(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): [ActiviteSprituelleStats!]!

  # PrescriptionItem queries
  prescriptionItems(dataEntryId: ID!): [PrescriptionItem!]!

  # Reports & Statistics
  reports: GlobalReports!
  reportsByDispensaire(dispensaireId: ID!): DispensaireReports!
  reportsByPeriod(dateFrom: DateTime, dateTo: DateTime, dispensaireId: ID): PeriodReports!
  reportsByConsultationType(dateFrom: DateTime, dateTo: DateTime, dispensaireId: ID): [ConsultationTypeReport!]!
  dashboard(dispensaireId: ID): Dashboard
  
  """
  Query metrics for a specific date range.
  Returns consultations count, new patients count, and pending sync count for the given period.
  Useful for calculating monthly, weekly, or custom period statistics.
  
  Example:
    metricsByRange(start: "2025-01-01", end: "2025-01-31")
  """
  metricsByRange(
    "Start date in ISO format (YYYY-MM-DD or ISO 8601)"
    start: String!
    "End date in ISO format (YYYY-MM-DD or ISO 8601)"
    end: String!
    "Optional: filter by specific dispensaire"
    dispensaireId: ID
  ): MetricsPayload!

  # Rapports avec filtres
  
  """
  Query top diagnostics/disease categories over a given period.
  
  Uses structured categories (categoriesWithMeta.categorieMaladieId) as primary data source,
  with fallback to diagnostic text field for consultations without structured categories.
  
  Returns the most frequent diagnostics with their count and percentage.
  Supports filtering by dispensaire and date range.
  Optimized for large datasets with indexed aggregations.
  
  Example:
    topDiagnostics(limit: 10, dispensaireId: "abc-123", startDate: "2025-01-01", endDate: "2025-12-31")
  """
  topDiagnostics(
    "Maximum number of results to return (default: 10)"
    limit: Int
    "Filter by specific dispensaire ID"
    dispensaireId: ID
    "Start date in ISO format (YYYY-MM-DD)"
    startDate: String
    "End date in ISO format (YYYY-MM-DD)"
    endDate: String
  ): [TopDiagnostic!]!
  
  """
  Query top prescribed medications over a given period.
  
  Uses structured prescription items (prescriptionItems.medicament) as data source.
  Ignores free-text prescription field.
  
  Returns the most frequently prescribed medications with their count, average duration, and total duration.
  Supports filtering by dispensaire and date range.
  Optimized for large datasets with indexed aggregations.
  
  Example:
    topMedications(limit: 10, dispensaireId: "abc-123", startDate: "2025-01-01", endDate: "2025-12-31")
  """
  topMedications(
    "Maximum number of results to return (default: 10)"
    limit: Int
    "Filter by specific dispensaire ID"
    dispensaireId: ID
    "Start date in ISO format (YYYY-MM-DD)"
    startDate: String
    "End date in ISO format (YYYY-MM-DD)"
    endDate: String
  ): [TopMedication!]!
  
  consultationsEvolution(
    period: String!
    dispensaireId: ID
    startDate: String
    endDate: String
  ): [ConsultationEvolution!]!
  
  dispensaireStats(
    dispensaireId: ID!
    startDate: String
    endDate: String
  ): DispensaireStats!
  
  """
  Query Fitoriana statistics: aggregates consultations by age group, gender, and dispensaire.
  
  Returns structured data for the "MAHAKASIKA NY ASA FITORIANA" section of Tatitra report.
  Age groups:
  - Zaza: ≤12 years old
  - Tanora: 13-30 years old
  - Olon-dehibe: >30 years old
  
  Supports filtering by:
  - Date range (dateFrom, dateTo) - required
  - Specific dispensaires (dispensaireIds) - optional, returns all if not specified
  - Religions (religions) - optional, filters by religion if specified
  
  Returns counts split by gender (lahy/vavy) for each dispensaire and total (fitambarany).
  
  Example:
    fitorianaStats(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      religions: ["Musulman"]
    )
  """
  fitorianaStats(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
    "Optional: filter by religions (e.g., ['Kristianina'], ['Musulman'])"
    religions: [Religion!]
  ): FitorianaStats!
  
  """
  Query consultants (unique patients) and consultations by dispensaire/zone for a given period.
  
  Returns the number of unique patients (consultants) and total consultations per dispensaire.
  This resolver provides aggregated data for Tatitra reporting and frontend visualizations.
  
  Returns:
  - consultants: Number of UNIQUE patients (DISTINCT patientId) who had at least one consultation in the period/dispensaire
  - consultations: Total count of DataEntry records for the period/dispensaire
  - A summary row with dispensaire=null containing totals across all dispensaires
  
  Supports filtering by:
  - Date range (dateFrom, dateTo) - required
  - Specific dispensaires (dispensaireIds) - optional, returns all active dispensaires if not specified
  
  Example:
    consultantsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
    )
  
  Example with dispensaire filter:
    consultantsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      dispensaireIds: ["abc-123", "def-456"]
    )
  """
  consultantsByZone(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
  ): [ConsultantsByZone!]!
  
  """
  Query diagnostics aggregated by zone/dispensaire for a given period.
  
  Returns diagnostic categories (or text fallback) with counts per dispensaire,
  enabling cross-tabulation tables (diagnostics x dispensaires) for Tatitra reports.
  
  Uses structured categories (categoriesWithMeta.categorieMaladieId) as primary data source,
  with fallback to diagnostic text field for consultations without structured categories.
  
  Returns results sorted by total count descending.
  
  Supports filtering by:
  - Date range (dateFrom, dateTo) - required
  - Specific dispensaires (dispensaireIds) - optional, returns all active dispensaires if not specified
  - Limit (limit) - optional, limits number of diagnostics returned (default: all)
  
  Example:
    diagnosticsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
    ) {
      diagnostic
      dispensaires {
        id
        name
        count
      }
      total
    }
  
  Example with filters:
    diagnosticsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      dispensaireIds: ["abc-123", "def-456"]
      limit: 20
    )
  """
  diagnosticsByZone(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
    "Optional: limit number of diagnostics returned (default: all)"
    limit: Int
  ): [DiagnosticsByZone!]!

  """
  Query education statistics by zone for Tatitra reports Section III.
  Returns education data grouped by category (short-term/long-term), dispensaire, and gender.
  
  Categories:
  - Fanabeazana aiza tsy maharitra (Short-term education)
  - Fanabeazana aiza maharitra (Long-term education)
  
  Uses consultations data with education-related keywords to aggregate statistics.
  
  Example:
    educationByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
    ) {
      category
      zones {
        id
        name
        male
        female
      }
      totalMale
      totalFemale
    }
  
  Example with filters:
    educationByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      dispensaireIds: ["abc-123", "def-456"]
    )
  """
  educationByZone(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
  ): [EducationCategoryByZone!]!

  """
  Query maternal health statistics by zone for Tatitra reports Section IV.
  Returns maternal health indicators grouped by dispensaire.
  
  Indicators:
  - Femmes ayant passé à la CPN (Consultation Prénatale)
  - Femmes enceintes ayant fait le Test VIH
  - Femmes enceintes ayant fait le Test sérologique
  - Accouchements
  
  Uses consultations data with specific typeConsultation codes and keywords to aggregate statistics.
  
  Example:
    maternalHealthByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
    ) {
      indicator
      dispensaires {
        id
        name
        count
      }
      total
    }
  
  Example with filters:
    maternalHealthByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      dispensaireIds: ["abc-123", "def-456"]
    )
  """
  maternalHealthByZone(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
  ): [MaternalHealthByZone!]!

  """
  Query events/awareness activities by zone for Tatitra reports Section V.
  Returns events grouped by dispensaire (zone) with theme, participants, date, and sessions.
  
  Each zone includes:
  - List of events (theme, participants, date, sessions)
  - Total participants across all events in that zone
  - Total sessions across all events in that zone
  
  Events are sorted by date in ascending order within each zone.
  Uses Event model data (type_event as theme, nombreParticipants, date, lieu).
  
  Example:
    eventsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
    ) {
      zone
      zoneId
      events {
        theme
        participants
        date
        sessions
      }
      totalParticipants
      totalSessions
    }
  
  Example with filters:
    eventsByZone(
      dateFrom: "2025-01-01"
      dateTo: "2025-03-31"
      dispensaireIds: ["abc-123", "def-456"]
    )
  """
  eventsByZone(
    "Start date in ISO format (YYYY-MM-DD) - required"
    dateFrom: String!
    "End date in ISO format (YYYY-MM-DD) - required"
    dateTo: String!
    "Optional: filter by specific dispensaires"
    dispensaireIds: [ID!]
  ): [EventsByZone!]!
}

# Mutations
type Mutation {
  # Auth
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!

  # Users
  createUser(input: CreateUserInput!): UserResponse!
  updateUser(id: ID!, input: UpdateUserInput!): UserResponse!
  deleteUser(id: ID!): UserResponse!
  changeUserPassword(id: ID!, currentPassword: String, newPassword: String, generateNew: Boolean): UserResponse!

  # Dispensaires
  createDispensaire(input: CreateDispensaireInput!): DispensaireResponse!
  updateDispensaire(id: ID!, input: UpdateDispensaireInput!): DispensaireResponse!
  deleteDispensaire(id: ID!): DispensaireResponse!

  # Patients
  createPatient(input: CreatePatientInput!): PatientResponse!
  updatePatient(id: ID!, input: UpdatePatientInput!): PatientResponse!
  deletePatient(id: ID!): PatientResponse!

  # DataEntries (Consultations)
  createDataEntry(input: CreateDataEntryInput!): DataEntryResponse!
  updateDataEntry(id: ID!, input: UpdateDataEntryInput!): DataEntryResponse!
  deleteDataEntry(id: ID!): DataEntryResponse!
  completeConsultation(id: ID!): DataEntryResponse!
  requireFollowUp(id: ID!, notes: String): DataEntryResponse!

  # TypeConsultation
  updateTypeConsultation(code: String!, input: UpdateTypeConsultationInput!): TypeConsultation!

  # Events
  createEvent(input: CreateEventInput!): EventResponse!
  updateEvent(id: ID!, input: UpdateEventInput!): EventResponse!

  # CategorieMaladie
  createCategorieMaladie(input: CreateCategorieMaladieInput!): CategorieMaladieResponse!
  updateCategorieMaladie(id: ID!, input: UpdateCategorieMaladieInput!): CategorieMaladieResponse!
  deleteCategorieMaladie(id: ID!): CategorieMaladieResponse!
  reorderCategories(updates: [ReorderInput!]!): Boolean!

  # Vaccination mutations
  createVaccination(input: CreateVaccinationInput!): VaccinationResponse!
  updateVaccination(id: ID!, input: UpdateVaccinationInput!): VaccinationResponse!
  deleteVaccination(id: ID!): VaccinationResponse!

  # ActiviteSpirituelle mutations
  createActiviteSpirituelle(input: CreateActiviteSprituelleInput!): ActiviteSprituelleResponse!
  updateActiviteSpirituelle(id: ID!, input: UpdateActiviteSprituelleInput!): ActiviteSprituelleResponse!
  deleteActiviteSpirituelle(id: ID!):ActiviteSprituelleResponse!

  # Sync mutations
  """
  Batch sync mutation for offline data synchronization.
  Accepts an array of items (patients, consultations) with clientTempId and returns
  a mapping of clientTempId -> serverId with status for each item.
  
  Example:
    syncBatch(items: [
      { clientTempId: "temp-123", type: "patient", payload: "{...}", createdAt: "2025-01-15T10:00:00Z" }
    ])
  """
  syncBatch(items: [SyncItemInput!]!): SyncBatchPayload!

  # Tatitra Report Export
  exportTatitraReport(quarter: String!, year: Int!, dispensaireId: ID): ExportResult!
}

# Export result type for Tatitra reports
type ExportResult {
  success: Boolean!
  message: String!
  url: String
  fileName: String
}

