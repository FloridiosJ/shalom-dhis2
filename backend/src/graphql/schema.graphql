  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  organisateur: User!
  dispensaire: Dispensaire
  fullTitle: String!
  isToday: Boolean!
  isUpcoming: Boolean!
}

# CategorieMaladie type (Hiérarchique)
