# Custom scalars
scalar DateTime

# Enums
enum UserRole {
  admin
  manager
  agent
}

enum AgentSpecialite {
  sage_femme
  infirmier
  infirmiere
}

enum OrganisationType {
  SynodaLehibe
  SynodamParitany
  Fileovana
  Fitandremana
  Fiangonana
}

# User type and auth
type User {
  id: ID!
  email: String!
  login: String!
  role: UserRole!
  nom: String!
  prenom: String!
  poste: String
  specialite: AgentSpecialite
  dispensaire: Dispensaire
  isActive: Boolean!
  lastLoginAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Organisation type and hierarchy
type Organisation {
  id: ID!
  name: String!
  code: String!
  level: Int!
  parentId: ID
  parent: Organisation
  children: [Organisation!]!
  dispensaires: [Dispensaire!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Dispensaire type
type Dispensaire {
  id: ID!
  name: String!
  code: String!
  address: String
  phone: String
  email: String
  organisationId: ID
  organisation: Organisation
  users: [User!]!
  dataEntries: [DataEntry!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Data entry type
type DataEntry {
  id: ID!
  value: String!
  dataElement: String!
  period: String!
  orgUnit: String!
  userId: ID!
  dispensaireId: ID
  user: User!
  dispensaire: Dispensaire
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Auth payload type
type AuthPayload {
  token: String!
  user: User!
}

type PasswordResetPayload {
  success: Boolean!
  temporaryPassword: String
  message: String!
}

type SyncResult {
  success: Boolean!
  message: String!
  syncedCount: Int
  errors: [String!]
}

# Input types
input CreateUserInput {
  email: String!
  login: String
  password: String
  role: UserRole!
  nom: String!
  prenom: String!
  poste: String
  specialite: AgentSpecialite
  dispensaireId: ID
}

input UpdateUserInput {
  email: String
  login: String
  nom: String
  prenom: String
  poste: String
  specialite: AgentSpecialite
  dispensaireId: ID
  isActive: Boolean
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input CreateOrganisationInput {
  name: String!
  code: String!
  level: Int!
  parentId: ID
}

input UpdateOrganisationInput {
  name: String
  code: String
  level: Int
  parentId: ID
}

input CreateDispensaireInput {
  name: String!
  code: String!
  address: String
  phone: String
  email: String
  organisationId: ID
}

input UpdateDispensaireInput {
  name: String
  code: String
  address: String
  phone: String
  email: String
  organisationId: ID
}

input CreateDataEntryInput {
  value: String!
  dataElement: String!
  period: String!
  orgUnit: String!
  dispensaireId: ID
}

input UpdateDataEntryInput {
  value: String
  dataElement: String
  period: String
  orgUnit: String
  dispensaireId: ID
}

# Queries
type Query {
  # User queries
  me: User
  users(role: UserRole, dispensaireId: ID): [User!]!
  user(id: ID!): User
  searchUsers(query: String!, role: UserRole): [User!]!

  # Organisation queries
  organisations: [Organisation!]!
  organisation(id: ID!): Organisation

  # Dispensaire queries
  dispensaires: [Dispensaire!]!
  dispensaire(id: ID!): Dispensaire

  # Data entry queries
  dataEntries: [DataEntry!]!
  dataEntry(id: ID!): DataEntry
}

# Mutations
type Mutation {
  # Auth mutations - CORRECTION ICI
  login(login: String!, password: String!): AuthPayload!
  logout: Boolean!

  # User management
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
  
  # Password management
  changePassword(input: ChangePasswordInput!): Boolean!
  resetUserPassword(userId: ID!): PasswordResetPayload!
  toggleUserStatus(userId: ID!): User!

  # Organisation mutations
  createOrganisation(input: CreateOrganisationInput!): Organisation!
  updateOrganisation(id: ID!, input: UpdateOrganisationInput!): Organisation!
  deleteOrganisation(id: ID!): Boolean!

  # Dispensaire mutations
  createDispensaire(input: CreateDispensaireInput!): Dispensaire!
  updateDispensaire(id: ID!, input: UpdateDispensaireInput!): Dispensaire!
  deleteDispensaire(id: ID!): Boolean!

  # Data entry mutations
  createDataEntry(input: CreateDataEntryInput!): DataEntry!
  updateDataEntry(id: ID!, input: UpdateDataEntryInput!): DataEntry!
  deleteDataEntry(id: ID!): Boolean!
  syncDataEntries: SyncResult!
}