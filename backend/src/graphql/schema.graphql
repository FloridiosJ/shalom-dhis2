# Custom scalars
scalar DateTime

# Enums
enum UserRole {
  admin
  manager
  agent
}

enum AgentSpecialite {
  sage_femme
  infirmier
  infirmiere
}

enum ConsultationStatus {
  en_cours
  termine
  suivi_requis
  active
  completed
  cancelled
}

enum Gender {
  M
  F
  L
}

enum Religion {
  Kristianina
  Musulman
  traditionnelle
}

enum Synoda {
  SPA
  SPSofia
  SPBM
  SPMel
}

enum OutilsEvent {
  presentiel
  visio
}

enum EventStatus {
  planifie
  en_cours
  termine
  annule
}

enum SortDirection {
  ASC
  DESC
}

# Enums pour Vaccination
enum TypeVaccin {
  BCG_POLIO_O
  DTCOQ_HEP_B_POLIO_I
  DTCOQ_HEP_B_POLIO_II
  DTCOQ_HEP_B_POLIO_III
  VAR
  VAA
  DTCOQ_HEP_B_POLIO_RAPPEL
  VPO_RAPPEL
  AUTRES
}

# Enums pour ActiviteSpirituelle
enum TypeActiviteSpirituelle {
  culte
  priere
}

# User type
type User {
  id: ID!
  nom: String!
  prenom: String!
  email: String
  login: String!
  role: UserRole!
  specialite: AgentSpecialite
  dispensaireId: ID
  dispensaire: Dispensaire
  isActive: Boolean!
  lastLoginAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  fullName: String!
}

# Dispensaire type
type Dispensaire {
  id: ID!
  name: String!
  fileovana: String!
  synoda: Synoda!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  users: [User!]!
  dataEntries: [DataEntry!]!
  userCount: Int!
  activeUserCount: Int!
}

# Patient type
type Patient {
  id: ID!
  nom: String!
  prenom: String
  age: Int!
  sexe: String!
  religion: Religion!
  village: String!
  numeroPatient: String!
  dispensaireId: ID!
  userId: ID!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: User!
  dispensaire: Dispensaire!
  consultations: [DataEntry!]!
  vaccinations: [Vaccination!]! # ✅ AJOUTER
  displayName: String!
  categorieAge: String!
  isMineur: Boolean!
}

# TypeConsultation type
type TypeConsultation {
  code: String!
  libelle: String!
  description: String
  isActive: Boolean!
  dataEntriesCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Association DataEntry <-> CategorieMaladie avec métadonnées
type CategorieWithMeta {
  id: ID!
  nom: String! # ✅ Utilise "nom" comme CategorieMaladie
  code: String
  niveau: Int!
  ordre: Int
  description: String
  isPrincipal: Boolean!
  notes: String
  parent: CategorieMaladie
  cheminComplet: String!
  associationCreatedAt: DateTime
}

# DataEntry type (Consultation)
type DataEntry {
  id: ID!
  patientId: ID!
  patient: Patient!
  typeConsultation: String!
  typeConsultationDetails: TypeConsultation
  diagnostic: String!
  prescription: String
  notes: String
  dateConsultation: DateTime!
  dispensaireId: ID!
  dispensaire: Dispensaire!
  userId: ID!
  createdBy: User!
  status: ConsultationStatus!
  categories: [CategorieMaladie!]!
  categoriesWithMeta: [CategorieWithMeta!]!
  principalCategorie: CategorieMaladie
  vaccinations: [Vaccination!]! # ✅ AJOUTER
  isActive: Boolean!
  summary: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Event type
type Event {
  id: ID!
  date: DateTime!
  type_event: String!
  participant: String!
  outils: OutilsEvent!
  description: String
  lieu: String
  userId: ID!
  dispensaireId: ID
  status: EventStatus!
  nombreParticipants: Int!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  organisateur: User!
  dispensaire: Dispensaire
  fullTitle: String!
  isToday: Boolean!
  isUpcoming: Boolean!
}

# CategorieMaladie type (Hiérarchique)
type CategorieMaladie {
  id: ID!
  nom: String!
  code: String
  parentId: ID
  niveau: Int!
  ordre: Int
  description: String
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  parent: CategorieMaladie
  sousCategories: [CategorieMaladie!]!
  dataEntries: [DataEntry!]!
  cheminComplet: String!
  nombreSousCategories: Int!
  nombreConsultations: Int!
  hasSousCategories: Boolean!
}

# Type pour l'arbre hiérarchique
type ArbreCategorie {
  id: ID!
  nom: String!
  code: String
  niveau: Int!
  ordre: Int
  description: String
  isActive: Boolean!
  sousCategories: [ArbreCategorie!]!
  nombreConsultations: Int!
}

# Type pour les statistiques de catégories
type CategorieStats {
  categorie: CategorieMaladie!
  nombreConsultations: Int!
  pourcentage: Float!
  tendance: String
}

# Statistiques par type de consultation
type ConsultationStatsByType {
  typeConsultation: TypeConsultation!
  total: Int!
  thisMonth: Int!
  thisWeek: Int!
  byStatus: [StatusCount!]!
}

type StatusCount {
  status: String!
  count: Int!
}

# Statistiques globales
type ConsultationOverallStats {
  totalConsultations: Int!
  consultationsByStatus: [StatusCount!]!
  consultationsByType: [ConsultationStatsByType!]!
  consultationsThisMonth: Int!
  consultationsToday: Int!
  patientsSeen: Int!
}

# Auth payload type
type AuthPayload {
  token: String!
  user: User!
}

# Vaccination type
type Vaccination {
  id: ID!
  dataEntryId: ID
  dataEntry: DataEntry
  patientId: ID!
  patient: Patient!
  dateVaccination: DateTime!
  typeVaccin: TypeVaccin!
  lot: String
  agentId: ID!
  agent: User!
  remarques: String
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  
  # Champs calculés
  vaccinLabel: String!
  summary: String!
  isRecent: Boolean!
}

# Statistiques de vaccination
type VaccinationStats {
  typeVaccin: TypeVaccin!
  label: String!
  count: Int!
  pourcentage: Float!
}

# Couverture vaccinale
type CouvertureVaccinale {
  totalPatients: Int!
  totalVaccinations: Int!
  parVaccin: [VaccinationStats!]!
  tauxCouverture: Float!
}

# ActiviteSpirituelle type
type ActiviteSpirituelle {
  id: ID!
  date: DateTime!
  dispensaireId: ID!
  dispensaire: Dispensaire!
  typeActivite: TypeActiviteSpirituelle!
  nombreParticipants: Int
  precheur: String
  versetPreche: String
  theme: String
  notes: String
  agentId: ID!
  agent: User!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  
  # Champs calculés
  typeLabel: String!
  summary: String!
  isRecent: Boolean!
  isToday: Boolean!
  isUpcoming: Boolean!
}

# Statistiques d'activités spirituelles
type ActiviteSprituelleStats {
  typeActivite: TypeActiviteSpirituelle!
  count: Int!
  totalParticipants: Int!
  moyenneParticipants: Float!
}

# Response types
type UserResponse {
  user: User
  success: Boolean!
  message: String!
  errors: [String!]
  generatedLogin: String
  generatedPassword: String
}

type PatientResponse {
  patient: Patient
  success: Boolean!
  message: String!
  errors: [String!]
  generatedNumero: String
}

type DataEntryResponse {
  dataEntry: DataEntry
  success: Boolean!
  message: String!
  errors: [String!]
}

type DispensaireResponse {
  dispensaire: Dispensaire
  success: Boolean!
  message: String!
  errors: [String!]
}

type EventResponse {
  event: Event
  success: Boolean!
  message: String!
  errors: [String!]
}

type CategorieMaladieResponse {
  categorie: CategorieMaladie
  success: Boolean!
  message: String!
  errors: [String!]
}

type DeleteCheckResponse {
  canDelete: Boolean!
  sousCategories: Int!
  dataEntries: Int!
  message: String!
}

type VaccinationResponse {
  vaccination: Vaccination
  success: Boolean!
  message: String!
  errors: [String!]
}

type ActiviteSprituelleResponse {
  activite: ActiviteSpirituelle
  success: Boolean!
  message: String!
  errors: [String!]
}

# Paginated results
type DataEntryConnection {
  dataEntries: [DataEntry!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type PatientConnection {
  patients: [Patient!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type DispensaireConnection {
  dispensaires: [Dispensaire!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type EventConnection {
  events: [Event!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type UserConnection {
  users: [User!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type VaccinationConnection {
  vaccinations: [Vaccination!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type ActiviteSprituelleConnection {
  activites: [ActiviteSpirituelle!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Input types
input LoginInput {
  login: String!
  password: String!
}

input CreateUserInput {
  nom: String!
  prenom: String!
  email: String
  login: String
  password: String
  role: UserRole!
  specialite: AgentSpecialite
  dispensaireId: ID
}

input UpdateUserInput {
  nom: String
  prenom: String
  email: String
  login: String
  password: String
  role: UserRole
  specialite: AgentSpecialite
  isActive: Boolean
}

input CreateDispensaireInput {
  name: String!
  fileovana: String!
  synoda: Synoda!
}

input UpdateDispensaireInput {
  name: String
  fileovana: String
  synoda: Synoda
  isActive: Boolean
}

input CreatePatientInput {
  nom: String!
  prenom: String
  age: Int!
  sexe: String!
  religion: Religion!
  village: String!
  dispensaireId: ID!
  numeroPatient: String
}

input UpdatePatientInput {
  nom: String
  prenom: String
  age: Int
  sexe: String
  religion: Religion
  village: String
  dispensaireId: ID
  isActive: Boolean
}

# Input pour associer des catégories avec métadonnées
input CategorieAssociationInput {
  categorieMaladieId: ID!
  isPrincipal: Boolean
  notes: String
}

input CreateDataEntryInput {
  patientId: ID!
  typeConsultation: String!
  diagnostic: String!
  prescription: String
  notes: String
  dateConsultation: DateTime
  dispensaireId: ID
  categorieIds: [ID!]
  categories: [CategorieAssociationInput!]
}

input UpdateDataEntryInput {
  diagnostic: String
  prescription: String
  notes: String
  dateConsultation: DateTime
  status: ConsultationStatus
  categorieIds: [ID!]
  categories: [CategorieAssociationInput!]
}

input CreateEventInput {
  date: DateTime!
  type_event: String!
  participant: String!
  outils: OutilsEvent!
  description: String
  lieu: String
  dispensaireId: ID
  nombreParticipants: Int
}

input UpdateEventInput {
  date: DateTime
  type_event: String
  participant: String
  outils: OutilsEvent
  description: String
  lieu: String
  dispensaireId: ID
  status: EventStatus
  nombreParticipants: Int
  isActive: Boolean
}

input CreateCategorieMaladieInput {
  nom: String!
  code: String
  parentId: ID
  niveau: Int!
  ordre: Int
  description: String
}

input UpdateCategorieMaladieInput {
  nom: String
  code: String
  ordre: Int
  description: String
  isActive: Boolean
}

input CategorieMaladieFilterInput {
  niveau: Int
  parentId: ID
  isActive: Boolean
  search: String
}

input DataEntryFilterInput {
  patientId: ID
  typeConsultation: String
  status: ConsultationStatus
  dispensaireId: ID
  userId: ID
  dateFrom: DateTime
  dateTo: DateTime
  search: String
}

input PatientFilterInput {
  dispensaireId: ID
  religion: Religion
  sexe: String
  village: String
  ageMin: Int
  ageMax: Int
  isActive: Boolean
  search: String
}

input DispensaireFilterInput {
  synoda: Synoda
  isActive: Boolean
  search: String
}

input EventFilterInput {
  type_event: String
  outils: OutilsEvent
  status: EventStatus
  userId: ID
  dispensaireId: ID
  dateFrom: DateTime
  dateTo: DateTime
  isActive: Boolean
  search: String
}

input UserFilterInput {
  role: UserRole
  dispensaireId: ID
  isActive: Boolean
  specialite: AgentSpecialite
  search: String
}

input ReorderInput {
  id: ID!
  ordre: Int!
}

input PaginationInput {
  page: Int
  limit: Int
  offset: Int
}

input SortInput {
  field: String!
  direction: SortDirection!
}

input UpdateTypeConsultationInput {
  label: String
  description: String
  isActive: Boolean
}

input CreateVaccinationInput {
  dataEntryId: ID
  patientId: ID!
  dateVaccination: DateTime!
  typeVaccin: TypeVaccin!
  lot: String
  remarques: String
}

input UpdateVaccinationInput {
  dateVaccination: DateTime
  typeVaccin: TypeVaccin
  lot: String
  remarques: String
  isActive: Boolean
}

input VaccinationFilterInput {
  patientId: ID
  agentId: ID
  typeVaccin: TypeVaccin
  dateFrom: DateTime
  dateTo: DateTime
  isActive: Boolean
  search: String
}

input CreateActiviteSprituelleInput {
  date: DateTime!
  dispensaireId: ID!
  typeActivite: TypeActiviteSpirituelle!
  nombreParticipants: Int
  precheur: String
  versetPreche: String
  theme: String
  notes: String
}

input UpdateActiviteSprituelleInput {
  date: DateTime
  typeActivite: TypeActiviteSpirituelle
  nombreParticipants: Int
  precheur: String
  versetPreche: String
  theme: String
  notes: String
  isActive: Boolean
}

input ActiviteSprituelleFilterInput {
  dispensaireId: ID
  agentId: ID
  typeActivite: TypeActiviteSpirituelle
  dateFrom: DateTime
  dateTo: DateTime
  isActive: Boolean
  search: String
}

# Queries
type Query {
  # Auth
  me: User

  # Users
  user(id: ID!): User
  users(filter: UserFilterInput, pagination: PaginationInput): UserConnection!

  # Dispensaires
  dispensaire(id: ID!): Dispensaire
  dispensaires(filter: DispensaireFilterInput, pagination: PaginationInput): DispensaireConnection!

  # Patients
  patient(id: ID!): Patient
  patientByNumero(numero: String!): Patient
  patients(filter: PatientFilterInput, sort: SortInput, pagination: PaginationInput): PatientConnection!
  searchPatients(query: String!, dispensaireId: ID, limit: Int): [Patient!]!

  # DataEntries (Consultations)
  dataEntry(id: ID!): DataEntry
  dataEntries(filter: DataEntryFilterInput, sort: SortInput, pagination: PaginationInput): DataEntryConnection!
  patientConsultations(patientId: ID!, limit: Int): [DataEntry!]!
  recentConsultations(dispensaireId: ID, limit: Int): [DataEntry!]!
  
  # TypeConsultation
  typeConsultation(code: String!): TypeConsultation
  typeConsultations(isActive: Boolean): [TypeConsultation!]!

  # Statistics
  consultationStatsByType: [ConsultationStatsByType!]!
  consultationStats(dispensaireId: ID, userId: ID): ConsultationOverallStats!

  # Events
  event(id: ID!): Event
  events(filter: EventFilterInput, sort: SortInput, pagination: PaginationInput): EventConnection!

  # CategorieMaladie
  categorieMaladie(id: ID!): CategorieMaladie
  categorieMaladieByCode(code: String!): CategorieMaladie
  categoriesMaladies(filter: CategorieMaladieFilterInput): [CategorieMaladie!]!
  categoriesPrincipales(activeOnly: Boolean): [CategorieMaladie!]!
  arbreCategories(activeOnly: Boolean): [ArbreCategorie!]!
  sousCategories(parentId: ID!, activeOnly: Boolean): [CategorieMaladie!]!
  categoriesStats(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): [CategorieStats!]!
  checkDeleteCategorie(id: ID!): DeleteCheckResponse!

  # Vaccination queries
  vaccination(id: ID!): Vaccination
  vaccinations(filter: VaccinationFilterInput, sort: SortInput, pagination: PaginationInput): VaccinationConnection!
  patientVaccinations(patientId: ID!, limit: Int): [Vaccination!]!
  recentVaccinations(limit: Int): [Vaccination!]!
  vaccinationStats(agentId: ID, dateFrom: DateTime, dateTo: DateTime): [VaccinationStats!]!
  couvertureVaccinale(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): CouvertureVaccinale!

  # ActiviteSpirituelle queries
  activiteSpirituelle(id: ID!): ActiviteSpirituelle
  activitesSpiritulles(filter: ActiviteSprituelleFilterInput, sort: SortInput, pagination: PaginationInput): ActiviteSprituelleConnection!
  dispensaireActivites(dispensaireId: ID!, limit: Int): [ActiviteSpirituelle!]!
  recentesActivitesSpiritulles(limit: Int): [ActiviteSpirituelle!]!
  activitesSpirituellesStats(dispensaireId: ID, dateFrom: DateTime, dateTo: DateTime): [ActiviteSprituelleStats!]!
}

# Mutations
type Mutation {
  # Auth
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!

  # Users
  createUser(input: CreateUserInput!): UserResponse!
  updateUser(id: ID!, input: UpdateUserInput!): UserResponse!
  deleteUser(id: ID!): UserResponse!
  changeUserPassword(id: ID!, newPassword: String, generateNew: Boolean): UserResponse!

  # Dispensaires
  createDispensaire(input: CreateDispensaireInput!): DispensaireResponse!
  updateDispensaire(id: ID!, input: UpdateDispensaireInput!): DispensaireResponse!
  deleteDispensaire(id: ID!): DispensaireResponse!

  # Patients
  createPatient(input: CreatePatientInput!): PatientResponse!
  updatePatient(id: ID!, input: UpdatePatientInput!): PatientResponse!
  deletePatient(id: ID!): PatientResponse!

  # DataEntries (Consultations)
  createDataEntry(input: CreateDataEntryInput!): DataEntryResponse!
  updateDataEntry(id: ID!, input: UpdateDataEntryInput!): DataEntryResponse!
  deleteDataEntry(id: ID!): DataEntryResponse!
  completeConsultation(id: ID!): DataEntryResponse!
  requireFollowUp(id: ID!, notes: String): DataEntryResponse!

  # TypeConsultation
  updateTypeConsultation(code: String!, input: UpdateTypeConsultationInput!): TypeConsultation!

  # Events
  createEvent(input: CreateEventInput!): EventResponse!
  updateEvent(id: ID!, input: UpdateEventInput!): EventResponse!

  # CategorieMaladie
  createCategorieMaladie(input: CreateCategorieMaladieInput!): CategorieMaladieResponse!
  updateCategorieMaladie(id: ID!, input: UpdateCategorieMaladieInput!): CategorieMaladieResponse!
  deleteCategorieMaladie(id: ID!): CategorieMaladieResponse!
  reorderCategories(updates: [ReorderInput!]!): Boolean!

  # Vaccination mutations
  createVaccination(input: CreateVaccinationInput!): VaccinationResponse!
  updateVaccination(id: ID!, input: UpdateVaccinationInput!): VaccinationResponse!
  deleteVaccination(id: ID!): VaccinationResponse!

  # ActiviteSpirituelle mutations
  createActiviteSpirituelle(input: CreateActiviteSprituelleInput!): ActiviteSprituelleResponse!
  updateActiviteSpirituelle(id: ID!, input: UpdateActiviteSprituelleInput!): ActiviteSprituelleResponse!
  deleteActiviteSpirituelle(id: ID!): ActiviteSprituelleResponse!
}